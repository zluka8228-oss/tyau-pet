
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интерактивный пёсик Тяу</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f2ed;
      overflow: hidden;
      user-select: none;
    }

    model-viewer {
      display: block;
      width: 100vw;
      height: 100dvh;
      background: #f5f2ed;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-action,
    .ar-launch,
    .close-btn {
      border: none;
      background: #FFB7CE;
      color: #5a3443;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }

    .ar-launch {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 14px 20px;
      border-radius: 24px;
      font-size: 15px;
      white-space: nowrap;
    }

    .ar-launch:active,
    .btn-action:active,
    .close-btn:active {
      transform: scale(.96);
      background: #FFA1C3;
    }

    .close-btn {
      position: fixed;
      top: 20px;
      right: 16px;
      z-index: 1100;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 20px;
    }

    .menu {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      width: 94%;
      z-index: 1000;
    }

    .btn-action {
      padding: 13px 16px;
      border-radius: 24px;
      font-size: 14px;
    }

    #status {
      position: fixed;
      left: 50%;
      bottom: 100px;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(30, 30, 30, .82);
      color: white;
      font-size: 14px;
      text-align: center;
      z-index: 1200;
      display: none;
    }

    #goodbye-screen {
      position: fixed;
      inset: 0;
      background: #FFF200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      z-index: 2000;
    }

    #goodbye-screen h1 {
      color: #a34c70;
      font-size: 30px;
    }

    #goodbye-screen p {
      color: #555;
      font-size: 18px;
      font-weight: bold;
    }

    @media (max-width: 480px) {
      .menu { gap: 8px; }
      .btn-action { padding: 12px; font-size: 13px; }
      .ar-launch { top: 18px; font-size: 13px; }
    }
  </style>
</head>

<body>
  <model-viewer
    id="tyau"
    src="./Tyau.glb"
    alt="3D-модель пёсика Тяу"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1.5"
    exposure="1"
    loading="eager">

   
    <button slot="ar-button" style="display:none"
      aria-hidden="true" tabindex="-1">
      Запустить AR
    </button>
  </model-viewer>

  <button class="ar-launch" id="ar-launch">
    📸 Оживить пёсика Тяу на столе!
  </button>

  <button class="close-btn" id="close-btn" aria-label="Закрыть">
    ✖
  </button>

  <div class="menu" id="menu">
    <button class="btn-action"
      onclick="actionTyau('anim-eat', 'sound-eat')">
      🍪 Покормить
    </button>

    <button class="btn-action"
      onclick="actionTyau('anim-tickle', 'sound-bark')">
      ❤️ Почесать пузико
    </button>

    <button class="btn-action"
      onclick="actionTyau('anim-tail', 'sound-tail')">
      🔄 За хвостиком!
    </button>
  </div>

  <div id="status" role="status" aria-live="polite"></div>

  <div id="goodbye-screen">
    <h1>Спасибо, что поиграли с Тяу! 🐕✨</h1>
    <p>Хорошего и вкусного дня в нашем кафе! ☕️🧁</p>
  </div>

  <!-- Пока не подключены реальные звуковые файлы -->
  <audio id="sound-eat" preload="auto"></audio>
  <audio id="sound-bark" preload="auto"></audio>
  <audio id="sound-tail" preload="auto"></audio>

  <script>
    const tyauModel = document.getElementById('tyau');
    const statusBox = document.getElementById('status');
    const arButton = document.getElementById('ar-launch');

    let isAnimating = false;
    let statusTimer;

    function showStatus(message) {
      statusBox.textContent = message;
      statusBox.style.display = 'block';

      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => {
        statusBox.style.display = 'none';
      }, 5000);
    }

    // Сообщаем, если 3D-модель не загрузилась.
    tyauModel.addEventListener('load', () => {
      showStatus('Тяу готов к игре! 🐶');
    });

    tyauModel.addEventListener('error', () => {
      showStatus(
        'Не удалось загрузить Tyau.glb. Проверь файл и путь к нему.'
      );
    });

    // Запуск дополненной реальности.
    arButton.addEventListener('click', async () => {
      if (!tyauModel.loaded) {
        showStatus('Тяу ещё загружается. Подожди немного…');
        return;
      }

      if (!tyauModel.canActivateAR) {
        showStatus(
          
        );
        return;
      }

      try {
        await tyauModel.activateAR();
      } catch (error) {
        console.error('Ошибка запуска AR:', error);
        showStatus(
        
        );
      }
    });

    // Интерактивные кнопки.
    function actionTyau(animClass, soundId) {
      if (isAnimating) return;
      isAnimating = true;

      const sound = document.getElementById(soundId);

      if (sound & sound.getAttribute('src')) {
        sound.currentTime = 0;
        sound.play().catch(() => {});
      }

      tyauModel.classList.remove(
        'anim-eat', 'anim-tickle', 'anim-tail'
      );

      void tyauModel.offsetWidth;
      tyauModel.classList.add(animClass);

      setTimeout(() => {
        tyauModel.classList.remove(animClass);
        isAnimating = false;
      }, 2100);
    }

    // Закрытие игры.
    document.getElementById('close-btn').addEventListener('click', () => {
      tyauModel.style.display = 'none';
      arButton.style.display = 'none';
      document.getElementById('menu').style.display = 'none';
      document.getElementById('close-btn').style.display = 'none';
      statusBox.style.display = 'none';
      document.getElementById('goodbye-screen').style.display = 'flex';
    });
  </script>
</body>
</html>
