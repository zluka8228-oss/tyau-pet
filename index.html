 <!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Интерактивный пёсик Тяу на столах кафе</title>
    <!-- Подключаем бесплатную AR-библиотеку от Google -->
    <script type="module" src="https://unpkg.com"></script>
    <style>
      body { margin: 0; font-family: sans-serif; background: #fff; overflow: hidden; user-select: none; }
      model-viewer { width: 100vw; height: 100vh; }
      
      /* МЕНЮ В ДОФАМИНОВОМ СТИЛЕ КАФЕ */
      .menu { 
        position: absolute; 
        bottom: 35px; 
        left: 50%; 
        transform: translateX(-50%); 
        display: flex; 
        gap: 10px; 
        z-index: 999; 
        width: 92%; 
        justify-content: center; 
      }
      
      /* КОНФЕТНО-РОЗОВЫЕ КНОПКИ */
      button.btn-action { 
        padding: 14px 18px; 
        font-size: 15px; 
        border: none; 
        border-radius: 25px; 
        background: #FFB7CE; /* Пастельный розовый */
        color: #FFF200; /* Яркий жёлтый текст */
        font-weight: 900; 
        text-shadow: 1px 1px 2px rgba(0,0,0,0.2); 
        cursor: pointer; 
        box-shadow: 0 6px 12px rgba(255, 183, 206, 0.4); 
        transition: 0.2s ease; 
        white-space: nowrap; 
      }
      button.btn-action:active { 
        transform: scale(0.92); 
        background: #FFA1C3; 
      }

      /* РОЗОВАЯ КНОПКА-КРЕСТИК ВВЕРХУ СПРАВА */
      .close-btn {
        position: absolute;
        top: 25px;
        right: 25px;
        z-index: 1000;
        width: 45px;
        height: 45px;
        border: none;
        border-radius: 50%; 
        background: #FFB7CE;
        color: #FFF200;
        font-size: 22px;
        font-weight: 900;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        transition: 0.2s;
      }
      .close-btn:active { transform: scale(0.9); background: #FFA1C3; }

      /* ЭКРАН ДОФАМИНОВОГО ПРОЩАНИЯ */
      #goodbye-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #FFF200; /* Фирменный жёлтый фон */
        display: none; 
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      #goodbye-screen h1 {
        color: #FFB7CE; /* Розовый текст */
        font-size: 32px;
        font-weight: 900;
        margin-bottom: 15px;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
      }
      #goodbye-screen p {
        color: #555;
        font-size: 18px;
        font-weight: bold;
      }

      /* ПАРАМЕТРИЧЕСКИЕ АНИМАЦИИ МОДЕЛИ */
      @keyframes jumpEat {
        0%, 100% { transform: translateY(0) scale(1); }
        30% { transform: translateY(-0.25m) scale(1.1, 0.9); }
        50% { transform: translateY(-0.4m) scale(0.9, 1.1); }
        70% { transform: translateY(0) scale(1.1, 0.9); }
      }
      @keyframes tickleShake {
        0%, 100% { transform: rotate(0deg) scale(1); }
        20%, 60% { transform: rotate(-6deg) scale(1.05, 0.95); }
        40%, 80% { transform: rotate(6deg) scale(0.95, 1.05); }
      }
      @keyframes tailChase {
        0% { transform: rotateY(0deg); }
        100% { transform: rotateY(360deg); }
      }
      .anim-eat { animation: jumpEat 0.7s ease-in-out 3; }
      .anim-tickle { animation: tickleShake 0.2s linear 8; }
      .anim-tail { animation: tailChase 0.4s linear 3; }
    </style>
  </head>
  <body>

    <!-- Кнопка закрытия игры всегда поверх всего -->
    <button class="close-btn" onclick="exitGame()">✖</button>

    <!-- Главное AR окно с пёсиком Тяу -->
    <model-viewer id="tyau" src="Tyau.glb.txt" ar ar-modes="webxr scene-viewer quick-look" camera-controls touch-action="pan-y" shadow-intensity="1.5" shadow-softness="1">
 <button slot="ar-button" style="position: absolute; top: 25px; left: 25px; background: #FFB7CE; color:#FFF200; padding: 12px 20px; border-radius: 20px; border:none; font-weight:bold; font-size:14px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        📸 Оживить пёсика Тяу на столе!
      </button>
      
      <!-- Интерактивное меню -->
      <div class="menu">
        <button class="btn-action" onclick="actionTyau('anim-eat', 'sound-eat')">🍪 Покормить</button>
        <button class="btn-action" onclick="actionTyau('anim-tickle', 'sound-bark')">❤️ Почесать пузико</button>
        <button class="btn-action" onclick="actionTyau('anim-tail', 'sound-tail')">🔄 За хвостиком!</button>
      </div>
    </model-viewer>

    <!-- Экран дофаминового прощания -->
    <div id="goodbye-screen">
      <h1>Спасибо, что поиграли с Тяу! 🐕✨</h1>
      <p>Хорошего и вкусного дня в нашем кафе! ☕️🧁</p>
    </div>

    <!-- Облачные интернет-аудиоплееры для звуков интерактива -->
    <audio id="sound-eat" src="https://google.com" preload="auto"></audio>
    <audio id="sound-bark" src="https://google.com" preload="auto"></audio>
    <audio id="sound-tail" src="https://google.com" preload="auto"></audio>

    <script>
      const tyauModel = document.querySelector('#tyau');
      let isAnimating = false;

      // Логика интерактива пёсика со звуком
      function actionTyau(animClass, soundId) {
        if (isAnimating) return;
        isAnimating = true;

        const sound = document.getElementById(soundId);
        if (sound) {
          sound.currentTime = 0;
          sound.play().catch(e => console.log("Включите звук тапом по экрану"));
        }

        tyauModel.classList.add(animClass);
        
        setTimeout(() => {
          tyauModel.classList.remove(animClass);
          isAnimating = false;
        }, 2100);
      }

      // Функция кнопки закрытия (Крестик)
      function exitGame() {
        tyauModel.style.display = 'none';
        document.querySelector('.close-btn').style.display = 'none';
        
        const goodbye = document.getElementById('goodbye-screen');
        goodbye.style.display = 'flex';
      }
    </script>
  </body>
</html>
